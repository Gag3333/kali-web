<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Admin Login Portal</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
        }
        
        /* Glassmorphism Effect */
        .glass-card {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* Ambient Glow Spheres */
        .glow-orb-1 {
            background: radial-gradient(circle, rgba(99, 102, 241, 0.4) 0%, rgba(0, 0, 0, 0) 70%);
        }
        .glow-orb-2 {
            background: radial-gradient(circle, rgba(236, 72, 153, 0.35) 0%, rgba(0, 0, 0, 0) 70%);
        }

        /* Floating Input Styling */
        .input-group input:focus ~ label,
        .input-group input:not(:placeholder-shown) ~ label {
            transform: translateY(-1.5rem) scale(0.85);
            color: #818cf8;
        }

        /* Shake Animation for Failed Login */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }
        .animate-shake {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }

        /* Success Pulse Animation */
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }
        .animate-pop-in {
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden text-slate-100">

    <!-- Background Animated Orbs -->
    <div class="absolute -top-24 -left-24 w-96 h-96 glow-orb-1 rounded-full pointer-events-none animate-pulse"></div>
    <div class="absolute -bottom-24 -right-24 w-96 h-96 glow-orb-2 rounded-full pointer-events-none animate-pulse" style="animation-delay: 1s;"></div>

    <main class="w-full max-w-md relative z-10">
        <!-- Login Card -->
        <div id="loginCard" class="glass-card rounded-3xl p-8 transition-all duration-500 transform">
            <!-- Header -->
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-indigo-600/30 border border-indigo-400/30 text-indigo-400 mb-4 shadow-lg shadow-indigo-500/10">
                    <i class="fa-solid font-bold text-2xl fa-shield-halved"></i>
                </div>
                <h1 class="text-2xl font-bold tracking-tight text-white">Welcome Back</h1>
                <p class="text-sm text-slate-400 mt-1">Please enter your admin credentials</p>
            </div>

            <!-- Toast / Alert Message Box -->
            <div id="alertBox" class="hidden mb-6 p-4 rounded-xl text-sm font-medium transition-all duration-300 flex items-center gap-3" role="alert">
                <i id="alertIcon" class="text-lg"></i>
                <span id="alertMessage"></span>
            </div>

            <!-- Login Form -->
            <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-6" novalidate>
                <!-- Username Input -->
                <div class="relative input-group">
                    <input 
                        type="text" 
                        id="username" 
                        placeholder=" " 
                        required
                        autocomplete="off"
                        class="w-full bg-slate-900/50 border border-slate-700/80 rounded-xl px-4 pt-5 pb-2 text-sm text-white focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all peer"
                    />
                    <label 
                        for="username" 
                        class="absolute left-4 top-3.5 text-slate-400 text-sm transition-all pointer-events-none origin-left flex items-center gap-2"
                    >
                        <i class="fa-solid fa-user text-xs"></i> Username
                    </label>
                </div>

                <!-- Password Input -->
                <div class="relative input-group">
                    <input 
                        type="password" 
                        id="password" 
                        placeholder=" " 
                        required
                        class="w-full bg-slate-900/50 border border-slate-700/80 rounded-xl pl-4 pr-12 pt-5 pb-2 text-sm text-white focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all peer"
                    />
                    <label 
                        for="password" 
                        class="absolute left-4 top-3.5 text-slate-400 text-sm transition-all pointer-events-none origin-left flex items-center gap-2"
                    >
                        <i class="fa-solid fa-lock text-xs"></i> Password
                    </label>
                    <!-- Toggle Password Visibility Button -->
                    <button 
                        type="button" 
                        onclick="togglePasswordVisibility()" 
                        aria-label="Toggle password visibility"
                        class="absolute right-4 top-4 text-slate-400 hover:text-slate-200 transition-colors focus:outline-none"
                    >
                        <i id="eyeIcon" class="fa-solid fa-eye"></i>
                    </button>
                </div>

                <!-- Remember Me & Reset Fields -->
                <div class="flex items-center justify-between text-xs text-slate-400">
                    <label class="flex items-center gap-2 cursor-pointer select-none">
                        <input type="checkbox" class="rounded bg-slate-900 border-slate-700 text-indigo-600 focus:ring-indigo-500 focus:ring-offset-slate-900">
                        <span>Remember me</span>
                    </label>
                    <button type="button" onclick="clearForm()" class="hover:text-indigo-400 transition-colors focus:outline-none">
                        Clear inputs
                    </button>
                </div>

                <!-- Submit Button -->
                <button 
                    type="submit" 
                    id="submitBtn"
                    class="w-full py-3.5 px-4 bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white font-semibold rounded-xl shadow-lg shadow-indigo-500/25 active:scale-[0.98] transition-all flex items-center justify-center gap-2"
                >
                    <span id="btnText">Sign In</span>
                    <i id="btnIcon" class="fa-solid fa-arrow-right text-sm"></i>
                </button>
            </form>

            <!-- Card Footer -->
            <div class="mt-8 pt-6 border-t border-slate-800 text-center text-xs text-slate-500">
                <p>Default Credentials: <span class="text-indigo-400 font-mono">admin</span> / <span class="text-indigo-400 font-mono">12345678</span></p>
            </div>
        </div>

        <!-- Success View Container (Hidden initially) -->
        <div id="successCard" class="hidden glass-card rounded-3xl p-8 text-center animate-pop-in border-emerald-500/30">
            <div class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-emerald-500/20 border border-emerald-500/40 text-emerald-400 mb-6 shadow-lg shadow-emerald-500/10">
                <i class="fa-solid fa-check text-4xl"></i>
            </div>
            <h2 class="text-2xl font-bold text-white mb-2">Login Successful!</h2>
            <p class="text-slate-300 text-sm mb-6">Welcome back, <span class="text-emerald-400 font-semibold">Admin</span>. You have successfully authenticated into the control panel.</p>
            
            <div class="p-4 bg-slate-900/60 rounded-xl border border-slate-800 mb-6 text-left text-xs space-y-2">
                <div class="flex justify-between text-slate-400">
                    <span>Role:</span>
                    <span class="text-slate-200 font-medium">Administrator</span>
                </div>
                <div class="flex justify-between text-slate-400">
                    <span>Status:</span>
                    <span class="text-emerald-400 font-medium flex items-center gap-1">
                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-ping"></span> Active Session
                    </span>
                </div>
            </div>

            <button 
                onclick="logout()" 
                class="w-full py-3 px-4 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 font-medium rounded-xl transition-all flex items-center justify-center gap-2"
            >
                <i class="fa-solid fa-right-from-bracket"></i>
                <span>Sign Out</span>
            </button>
        </div>
    </main>

    <script>
        // Toggle password visibility
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            }
        }

        // Clear input fields
        function clearForm() {
            document.getElementById('loginForm').reset();
            hideAlert();
        }

        // Display Alert message
        function showAlert(message, isSuccess) {
            const alertBox = document.getElementById('alertBox');
            const alertIcon = document.getElementById('alertIcon');
            const alertMessage = document.getElementById('alertMessage');

            alertBox.classList.remove('hidden', 'bg-red-500/10', 'text-red-400', 'border-red-500/30', 'bg-emerald-500/10', 'text-emerald-400', 'border-emerald-500/30');
            alertIcon.classList.remove('fa-circle-xmark', 'fa-circle-check');

            if (isSuccess) {
                alertBox.classList.add('bg-emerald-500/10', 'text-emerald-400', 'border', 'border-emerald-500/30');
                alertIcon.classList.add('fa-solid', 'fa-circle-check');
            } else {
                alertBox.classList.add('bg-red-500/10', 'text-red-400', 'border', 'border-red-500/30');
                alertIcon.classList.add('fa-solid', 'fa-circle-xmark');
            }

            alertMessage.textContent = message;
        }

        // Hide Alert message
        function hideAlert() {
            document.getElementById('alertBox').classList.add('hidden');
        }

        // Form Login Handler
        function handleLogin(event) {
            event.preventDefault();
            
            const usernameInput = document.getElementById('username').value.trim();
            const passwordInput = document.getElementById('password').value;
            const loginCard = document.getElementById('loginCard');
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const btnIcon = document.getElementById('btnIcon');

            // Remove existing shake animation
            loginCard.classList.remove('animate-shake');

            // Validation check
            if (!usernameInput || !passwordInput) {
                showAlert('Please fill in both fields.', false);
                triggerShake(loginCard);
                return;
            }

            // Simulate loading state
            submitBtn.disabled = true;
            btnText.textContent = 'Authenticating...';
            btnIcon.className = 'fa-solid fa-spinner fa-spin text-sm';

            setTimeout(() => {
                // Re-enable button
                submitBtn.disabled = false;
                btnText.textContent = 'Sign In';
                btnIcon.className = 'fa-solid fa-arrow-right text-sm';

                // Check credentials (admin / 12345678)
                if (usernameInput === 'admin' && passwordInput === '12345678') {
                    // Success logic
                    showAlert('Login Successful! Welcome, Admin.', true);
                    
                    setTimeout(() => {
                        loginCard.classList.add('hidden');
                        document.getElementById('successCard').classList.remove('hidden');
                    }, 800);

                } else {
                    // Failure logic
                    showAlert('Incorrect Username or Password. Please try again.', false);
                    triggerShake(loginCard);
                }
            }, 600);
        }

        // Trigger visual shake effect on failure
        function triggerShake(element) {
            void element.offsetWidth; // Trigger reflow
            element.classList.add('animate-shake');
        }

        // Handle Logout
        function logout() {
            const loginCard = document.getElementById('loginCard');
            const successCard = document.getElementById('successCard');

            successCard.classList.add('hidden');
            loginCard.classList.remove('hidden');
            
            clearForm();
            hideAlert();
        }
    </script>
</body>
</html>
